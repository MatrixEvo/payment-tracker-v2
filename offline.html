<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Offline - Payment Tracker 2.0</title>
    <meta name="theme-color" content="#1e1b4b">
    
    <!-- PWA Requirements -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS (Need to have an inline basic style just in case Tailwind isn't cached, but it should be) -->
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif, system-ui, -apple-system;
            background: linear-gradient(to bottom right, #0f172a, #1e1b4b);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            backdrop-filter: blur(10px);
        }
        h1 {
            margin-top: 0;
            font-size: 2rem;
            font-weight: 700;
        }
        p {
            color: #cbd5e1;
            margin-bottom: 2rem;
            line-height: 1.5;
        }
        .button {
            display: inline-block;
            background-color: #6366f1;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .button:hover {
            background-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(99,102,241,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto 1.5rem auto; display: block;">
            <path d="m2 2 20 20"/>
            <path d="M8.5 8.5C7.1 9.9 6 11 6 11c-3.3 3.3-3.3 8.7 0 12 3.3 3.3 8.7 3.3 12 0 0 0 1.1-1.1 2.5-2.5"/>
            <path d="M16 16c1.1-1.1 2.5-2.5 2.5-2.5 3.3-3.3 3.3-8.7 0-12-3.3-3.3-8.7-3.3-12 0 0 0-1.1 1.1-2.5 2.5"/>
        </svg>
        <h1>You are offline</h1>
        <p>It seems you've lost your internet connection. Check your network and try again.</p>
        <a href="/" class="button">Try Again</a>
    </div>
</body>
</html>
